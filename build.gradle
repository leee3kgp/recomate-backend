plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.recomate'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation platform('software.amazon.awssdk:bom:2.57.3')
	implementation 'software.amazon.awssdk:dynamodb'
	implementation 'software.amazon.awssdk:cognitoidentityprovider'
	runtimeOnly 'software.amazon.awssdk:signin'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 21
}

tasks.named('bootJar') {
	archiveFileName = 'recomate.jar'
}

tasks.named('bootRun') {
	javaLauncher = javaToolchains.launcherFor(java.toolchain)
	environment 'AWS_PROFILE', providers.environmentVariable('AWS_PROFILE').orElse('recomate').get()
	environment 'AWS_REGION', 'ap-southeast-2'
}

tasks.named('test') {
	useJUnitPlatform()
}

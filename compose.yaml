services:
  api:
    image: recomate-backend:local
    platform: linux/amd64
    build:
      context: .
      target: runtime
      provenance: false
      sbom: false
    ports:
      - "127.0.0.1:${RECOMATE_PORT:-8080}:8080"
    environment:
      AWS_REGION: ap-southeast-2
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-ap-southeast-2_Cjugq3j3p}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-7h7kjle5d1dh6ogea95thrk20q}
      USERS_TABLE: ${USERS_TABLE:-recomate-users-dev}
      SESSIONS_TABLE: ${SESSIONS_TABLE:-RecommendationSession}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 30s

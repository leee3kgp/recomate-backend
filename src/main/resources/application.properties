spring.application.name=recomate

# Public Cognito identifiers, shared by the existing frontend. No credentials.
recomate.auth.issuer=${COGNITO_ISSUER:https://cognito-idp.${recomate.aws.region}.amazonaws.com/${recomate.auth.user-pool-id}}
recomate.auth.client-id=${COGNITO_CLIENT_ID:7h7kjle5d1dh6ogea95thrk20q}
recomate.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
recomate.aws.region=ap-southeast-2
recomate.auth.user-pool-id=${COGNITO_USER_POOL_ID:ap-southeast-2_Cjugq3j3p}
recomate.dynamodb.users-table=${USERS_TABLE:recomate-users-dev}
# Must match the table owned by #3; no table is created automatically.
recomate.dynamodb.sessions-table=${SESSIONS_TABLE:recomate-sessions-dev}
